name: Feature request
description: An idea for how Croli could work better.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. The most useful requests describe **the
        problem you are trying to solve**, not only the solution you have in
        mind — there is often a smaller change that solves it.

        Croli deliberately aggregates many agent CLIs rather than replacing
        them, so requests are most likely to land when they work across agents
        instead of binding to one vendor.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation you are in today and why it is painful.
      placeholder: |
        When I … I have to … which means …
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: Your suggested solution, if you have one in mind.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
      description: Workarounds you use today, or other tools that solve this well.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Which part of Croli does this touch?
      options:
        - Workspace / sessions
        - Agents and delegation
        - Tasks and automations
        - Git / worktrees
        - MCP and skills
        - Server / Docker / mobile
        - Appearance and settings
        - Something else
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and did not find this already requested.
          required: true
